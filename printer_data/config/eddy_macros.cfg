[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
gcode:
  {% set Z = printer.toolhead.position.z %}
  SET_KINEMATIC_POSITION Z={Z - printer.probe.last_probe_position.z}

[gcode_macro SET_Z_FROM_PROBE]
gcode:
  {% set METHOD = params.METHOD | default("automatic") %}
  PROBE METHOD={METHOD}
  _RELOAD_Z_OFFSET_FROM_PROBE
  G0 Z5

[gcode_macro SAVE_EDDY_TAP_OFFSET]
description: Save Eddy Z-Offset value
gcode:
  Z_OFFSET_APPLY_PROBE METHOD=tap

[gcode_macro _EDDY_MOVE_TO_REFERENCE]
description: Internal helper for Eddy calibration positioning
gcode:
    {% set mode = params.MODE|default("NOZZLE")|upper %}

    # ------------------------------------------------------------
    # Read [bed_mesh] zero_reference_position
    # ------------------------------------------------------------
    {% if "bed_mesh" not in printer.configfile.config %}
        {action_raise_error(
            "No [bed_mesh] configuration was found. "
            "Eddy calibration requires zero_reference_position."
        )}
    {% endif %}

    {% set mesh_config = printer.configfile.config["bed_mesh"] %}
    {% set zero_ref_raw = mesh_config.get("zero_reference_position", "")|string %}

    {% if zero_ref_raw|trim == "" %}
        {action_raise_error(
            "[bed_mesh] zero_reference_position is not configured. "
            "Set zero_reference_position to the nozzle XY location "
            "to use for Eddy calibration."
        )}
    {% endif %}

    {% set zero_ref = zero_ref_raw.split(",") %}

    {% if zero_ref|length != 2 %}
        {action_raise_error(
            "Invalid [bed_mesh] zero_reference_position. "
            "Expected two values: X, Y"
        )}
    {% endif %}

    {% set x_ref = zero_ref[0]|trim|float %}
    {% set y_ref = zero_ref[1]|trim|float %}

    # Default:
    # zero_reference_position is a NOZZLE coordinate.
    {% set x_target = x_ref %}
    {% set y_target = y_ref %}

    # ------------------------------------------------------------
    # PROBE mode
    #
    # Used only when the Eddy sensor itself must be positioned over
    # zero_reference_position, such as LDC drive-current calibration.
    # ------------------------------------------------------------
    {% if mode == "PROBE" %}

        {% set ns = namespace(chip="", count=0) %}

        {% for section in printer.configfile.settings %}
            {% if section.split()[0] == "probe_eddy_current" %}
                {% set ns.chip = section.split()[-1] %}
                {% set ns.count = ns.count + 1 %}
            {% endif %}
        {% endfor %}

        {% if ns.chip == "" %}
            {action_raise_error(
                "No [probe_eddy_current <name>] configuration was found."
            )}
        {% elif ns.count > 1 %}
            {action_raise_error(
                "Multiple Eddy probes detected. "
                "This macro currently supports one configured Eddy probe."
            )}
        {% endif %}

        {% set probe_section = "probe_eddy_current " ~ ns.chip %}
        {% set probe_settings = printer.configfile.settings[probe_section] %}

        {% set x_offset = probe_settings.x_offset|default(0)|float %}
        {% set y_offset = probe_settings.y_offset|default(0)|float %}

        # zero_reference_position is where the NOZZLE would be.
        # Offset the toolhead only because LDC needs the EDDY SENSOR
        # over that same physical location.
        {% set x_target = x_ref - x_offset %}
        {% set y_target = y_ref - y_offset %}

    {% elif mode != "NOZZLE" %}

        {action_raise_error(
            "_EDDY_MOVE_TO_REFERENCE MODE must be NOZZLE or PROBE."
        )}

    {% endif %}

    # ------------------------------------------------------------
    # Validate the resulting toolhead position
    # ------------------------------------------------------------
    {% if x_target < printer.toolhead.axis_minimum.x
          or x_target > printer.toolhead.axis_maximum.x %}
        {action_raise_error(
            "Calculated Eddy calibration X position is outside "
            "the configured X travel limits."
        )}
    {% endif %}

    {% if y_target < printer.toolhead.axis_minimum.y
          or y_target > printer.toolhead.axis_maximum.y %}
        {action_raise_error(
            "Calculated Eddy calibration Y position is outside "
            "the configured Y travel limits."
        )}
    {% endif %}

    G90
    G0 X{x_target} Y{y_target}

    {% if mode == "PROBE" %}
        RESPOND TYPE=echo MSG="Eddy sensor positioned over calibration reference X{x_ref} Y{y_ref}."
    {% else %}
        RESPOND TYPE=echo MSG="Nozzle positioned at calibration reference X{x_ref} Y{y_ref}."
    {% endif %}

[gcode_macro EDDY_LDC_PREP]
description: Prepare Eddy sensor for initial LDC calibration or recalibration.
variable_prepared: 0
gcode:
    {% set ns = namespace(chip="", count=0) %}

    # Automatically locate configured Eddy probe
    {% for section in printer.configfile.settings %}
        {% if section.split()[0] == "probe_eddy_current" %}
            {% set ns.chip = section.split()[-1] %}
            {% set ns.count = ns.count + 1 %}
        {% endif %}
    {% endfor %}

    # Validate discovery
    {% if ns.chip == "" %}
        {action_raise_error(
            "No [probe_eddy_current <name>] configuration was found."
        )}
    {% elif ns.count > 1 %}
        {action_raise_error(
            "Multiple Eddy probes detected. "
            "This macro currently supports one configured Eddy probe."
        )}
    {% endif %}

    {% set probe_section = "probe_eddy_current " ~ ns.chip %}

    {% if probe_section not in printer.configfile.config %}
        {action_raise_error(
            "No [" ~ probe_section ~ "] configuration was found."
        )}
    {% endif %}

    {% set probe_config = printer.configfile.config[probe_section] %}

    # Determine whether main Eddy calibration has already been saved
    {% set z_cal_saved = "calibrate" in probe_config %}

    # Fake Z used only during first-time setup
    {% set z_fake = (printer.toolhead.axis_minimum.z +
                     printer.toolhead.axis_maximum.z) / 2 %}

    # ------------------------------------------------------------
    # INITIAL SETUP
    # ------------------------------------------------------------
    {% if not z_cal_saved %}

        RESPOND TYPE=echo MSG="No saved Eddy Z calibration detected. Using initial LDC preparation."

        # Home X/Y only
        {% if 'x' not in printer.toolhead.homed_axes %}
            G28 X
        {% endif %}

        {% if 'y' not in printer.toolhead.homed_axes %}
            G28 Y
        {% endif %}

        # LDC calibration requires the Eddy SENSOR over the
        # bed_mesh zero_reference_position.
        _EDDY_MOVE_TO_REFERENCE MODE=NOZZLE

        # Establish temporary Z coordinate
        {% if 'z' not in printer.toolhead.homed_axes %}
            SET_KINEMATIC_POSITION Z={z_fake} SET_HOMED=Z
            RESPOND TYPE=echo MSG="Temporary Z position established at Z={z_fake}."
        {% else %}
            RESPOND TYPE=echo MSG="Z is already homed. Existing Z position retained."
        {% endif %}

        SET_GCODE_VARIABLE MACRO=EDDY_LDC_PREP VARIABLE=prepared VALUE=1

        RESPOND TYPE=echo MSG="Manually jog Z until the Eddy sensor is approximately 20mm above the bed."
        RESPOND TYPE=echo MSG="Then run EDDY_LDC_CALIBRATE."

    # ------------------------------------------------------------
    # RECALIBRATION / ESTABLISHED CONFIGURATION
    # ------------------------------------------------------------
    {% else %}

        RESPOND TYPE=echo MSG="Existing Eddy Z calibration detected. Using normal homing for LDC preparation."

        {% if 'x' not in printer.toolhead.homed_axes
              or 'y' not in printer.toolhead.homed_axes %}
            G28
        {% else %}
            G28 Z
        {% endif %}

        G90
        G0 Z20

        # Position Eddy sensor over the configured reference point.
        _EDDY_MOVE_TO_REFERENCE MODE=NOZZLE

        SET_GCODE_VARIABLE MACRO=EDDY_LDC_PREP VARIABLE=prepared VALUE=1

        RESPOND TYPE=echo MSG="Eddy sensor positioned over the calibration reference at Z20."
        RESPOND TYPE=echo MSG="Run EDDY_LDC_CALIBRATE."

    {% endif %}

[gcode_macro EDDY_LDC_CALIBRATE]
description: Calibrate Eddy LDC drive current
gcode:
    {% set ns = namespace(chip="", count=0) %}

    {% for section in printer.configfile.settings %}
        {% if section.split()[0] == "probe_eddy_current" %}
            {% set ns.chip = section.split()[-1] %}
            {% set ns.count = ns.count + 1 %}
        {% endif %}
    {% endfor %}

    {% if ns.chip == "" %}
        {action_raise_error(
            "No [probe_eddy_current <name>] configuration was found."
        )}
    {% elif ns.count > 1 %}
        {action_raise_error(
            "Multiple Eddy probes detected. "
            "This macro currently supports one configured Eddy probe."
        )}
    {% endif %}

    {% set probe_section = "probe_eddy_current " ~ ns.chip %}

    {% if probe_section not in printer.configfile.config %}
        {action_raise_error(
            "No [" ~ probe_section ~ "] configuration was found."
        )}
    {% endif %}

    {% set probe_config = printer.configfile.config[probe_section] %}

    {% set ldc_saved = "reg_drive_current" in probe_config %}
    {% set z_cal_saved = "calibrate" in probe_config %}

    # ------------------------------------------------------------
    # INITIAL SETUP
    # ------------------------------------------------------------
    {% if not z_cal_saved %}

        {% if printer["gcode_macro EDDY_LDC_PREP"].prepared|int != 1 %}

            RESPOND TYPE=error MSG="Initial Eddy setup detected. EDDY_LDC_PREP must be run before LDC calibration."

            RESPOND TYPE=command MSG="action:prompt_begin Eddy LDC Calibration"
            RESPOND TYPE=command MSG="action:prompt_text No saved Eddy Z calibration was detected."
            RESPOND TYPE=command MSG="action:prompt_text Run EDDY_LDC_PREP, then manually position the Eddy sensor approximately 20mm above the bed."
            RESPOND TYPE=command MSG="action:prompt_button Run EDDY_LDC_PREP|EDDY_LDC_PREP|warning"
            RESPOND TYPE=command MSG="action:prompt_show"

        {% else %}

            # Reassert the correct XY location in case XY was changed
            # while the user was positioning Z.
            _EDDY_MOVE_TO_REFERENCE MODE=NOZZLE

            RESPOND TYPE=echo MSG="Using Eddy probe: {ns.chip}"
            RESPOND TYPE=echo MSG="Starting initial LDC drive current calibration."

            SET_GCODE_VARIABLE MACRO=EDDY_LDC_PREP VARIABLE=prepared VALUE=0

            LDC_CALIBRATE_DRIVE_CURRENT CHIP={ns.chip}

            RESPOND TYPE=echo MSG="LDC drive current calibration complete."
            RESPOND TYPE=echo MSG="Run SAVE_CONFIG to save the calibrated drive current."

        {% endif %}

    # ------------------------------------------------------------
    # RECALIBRATION
    # ------------------------------------------------------------
    {% else %}

        {% if ldc_saved %}
            RESPOND TYPE=echo MSG="Existing LDC calibration detected. Starting recalibration."
        {% else %}
            RESPOND TYPE=echo MSG="Existing Eddy Z calibration detected. Starting LDC calibration using normal homing."
        {% endif %}

        SET_GCODE_VARIABLE MACRO=EDDY_LDC_PREP VARIABLE=prepared VALUE=0

        {% if 'x' not in printer.toolhead.homed_axes
              or 'y' not in printer.toolhead.homed_axes %}
            G28
        {% else %}
            G28 Z
        {% endif %}

        G90
        G0 Z20

        # Eddy sensor, not nozzle, must be over zero_reference_position.
        _EDDY_MOVE_TO_REFERENCE MODE=NOZZLE

        RESPOND TYPE=echo MSG="Using Eddy probe: {ns.chip}"
        RESPOND TYPE=echo MSG="Eddy sensor positioned over the calibration reference at Z20."

        LDC_CALIBRATE_DRIVE_CURRENT CHIP={ns.chip}

        RESPOND TYPE=echo MSG="LDC drive current calibration complete."
        RESPOND TYPE=echo MSG="Run SAVE_CONFIG to save the calibrated drive current."

    {% endif %}

[gcode_macro EDDY_CURRENT_CALIBRATE]
description: Calibrate Eddy sensor Z height mapping (paper test)
gcode:
    {% set ns = namespace(chip="", count=0) %}

    {% for section in printer.configfile.settings %}
        {% if section.split()[0] == "probe_eddy_current" %}
            {% set ns.chip = section.split()[-1] %}
            {% set ns.count = ns.count + 1 %}
        {% endif %}
    {% endfor %}

    {% if ns.chip == "" %}
        {action_raise_error(
            "No [probe_eddy_current <name>] configuration was found."
        )}
    {% elif ns.count > 1 %}
        {action_raise_error(
            "Multiple Eddy probes detected. "
            "This macro currently supports one configured Eddy probe."
        )}
    {% endif %}

    {% set probe_section = "probe_eddy_current " ~ ns.chip %}

    {% if probe_section not in printer.configfile.config %}
        {action_raise_error(
            "No [" ~ probe_section ~ "] configuration was found."
        )}
    {% endif %}

    {% set probe_config = printer.configfile.config[probe_section] %}
    {% set z_cal_saved = "calibrate" in probe_config %}

    # ------------------------------------------------------------
    # INITIAL CALIBRATION
    # ------------------------------------------------------------
    {% if not z_cal_saved %}

        {% if printer["gcode_macro EDDY_CURRENT_PREP"].prepared|int != 1 %}

            RESPOND TYPE=error MSG="Initial Eddy calibration detected. EDDY_CURRENT_PREP must be run first."

            RESPOND TYPE=command MSG="action:prompt_begin Eddy Calibration"
            RESPOND TYPE=command MSG="action:prompt_text No saved Eddy Z calibration was detected."
            RESPOND TYPE=command MSG="action:prompt_text Run EDDY_CURRENT_PREP before starting the paper calibration."
            RESPOND TYPE=command MSG="action:prompt_button Run EDDY_CURRENT_PREP|EDDY_CURRENT_PREP|warning"
            RESPOND TYPE=command MSG="action:prompt_show"

        {% else %}

            # Reassert the nozzle reference location immediately before
            # starting Klipper's paper-test calibration.
            _EDDY_MOVE_TO_REFERENCE MODE=NOZZLE

            RESPOND TYPE=echo MSG="Using Eddy probe: {ns.chip}"
            RESPOND TYPE=echo MSG="Starting initial Eddy Z height calibration."
            RESPOND TYPE=echo MSG="Perform the paper test, then select ACCEPT."

            SET_GCODE_VARIABLE MACRO=EDDY_CURRENT_PREP VARIABLE=prepared VALUE=0

            PROBE_EDDY_CURRENT_CALIBRATE CHIP={ns.chip}

        {% endif %}

    # ------------------------------------------------------------
    # RECALIBRATION
    # ------------------------------------------------------------
    {% else %}

        RESPOND TYPE=echo MSG="Existing Eddy Z calibration detected. Starting recalibration."

        SET_GCODE_VARIABLE MACRO=EDDY_CURRENT_PREP VARIABLE=prepared VALUE=0

        {% if 'x' not in printer.toolhead.homed_axes
              or 'y' not in printer.toolhead.homed_axes %}
            G28
        {% else %}
            G28 Z
        {% endif %}

        G90
        G0 Z20

        # Main Eddy calibration begins with the NOZZLE at the
        # configured zero reference position.
        _EDDY_MOVE_TO_REFERENCE MODE=NOZZLE

        RESPOND TYPE=echo MSG="Using Eddy probe: {ns.chip}"
        RESPOND TYPE=echo MSG="Perform the paper test, then select ACCEPT."

        PROBE_EDDY_CURRENT_CALIBRATE CHIP={ns.chip}

    {% endif %}

[gcode_macro _EDDY_SETUP_TEMP_RUN]
gcode:
    {% set target = params.TARGET|default(80)|float %}

    RESPOND TYPE=command MSG="action:prompt_end"

    SAVE_VARIABLE VARIABLE=eddy_setup_target VALUE={target}

    SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=4
    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=2

    EDDY_TEMP_CALIBRATE TARGET={target}

    _EDDY_SETUP_TEMP_PROMPT

[gcode_macro _EDDY_SETUP_TEMP_PROMPT]
description: Display Eddy thermal calibration status
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set probe = svv.get("eddy_setup_probe", "") %}
    {% set target = svv.get("eddy_setup_target", 80)|float %}

    {% if probe == "" %}
        {action_raise_error(
            "No Eddy probe is stored in the active setup session."
        )}
    {% endif %}

    {% set temp_section = "temperature_probe " ~ probe %}

    {% if temp_section not in printer %}
        {action_raise_error(
            "Temperature probe '" ~ probe ~ "' is not available."
        )}
    {% endif %}

    {% set current_temp = printer[temp_section].temperature|float %}
    {% set running = printer[temp_section].in_calibration %}

    RESPOND TYPE=command MSG="action:prompt_end"

    {% if running %}

        RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup - Thermal Calibration Running"
        RESPOND TYPE=command MSG="action:prompt_text Thermal calibration is currently running."
        RESPOND TYPE=command MSG="action:prompt_text Current Eddy coil temperature: {current_temp|round(1)}C"
        RESPOND TYPE=command MSG="action:prompt_text Target coil temperature: {target}C"
        RESPOND TYPE=command MSG="action:prompt_text Klipper will automatically take samples as the Eddy temperature increases."
        RESPOND TYPE=command MSG="action:prompt_text If heating stalls before reaching the target, you may force another sample or finish using the samples collected so far."

        RESPOND TYPE=command MSG="action:prompt_button Force Next Sample - {current_temp|round(1)}C|_EDDY_SETUP_TEMP_FORCE_NEXT|warning"
        RESPOND TYPE=command MSG="action:prompt_button Refresh Temperature|_EDDY_SETUP_TEMP_REFRESH|info"
        RESPOND TYPE=command MSG="action:prompt_button Finish at Current Temperature|TEMPERATURE_PROBE_COMPLETE|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Abort Thermal Calibration|_EDDY_SETUP_TEMP_ABORT|error"

        RESPOND TYPE=command MSG="action:prompt_show"

    {% else %}

        RESPOND TYPE=echo MSG="Thermal calibration is no longer running. Waiting for calibration result."

    {% endif %}

[gcode_macro _EDDY_SETUP_TEMP_REFRESH]
description: Refresh Eddy thermal calibration temperature display
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    _EDDY_SETUP_TEMP_PROMPT

[gcode_macro _EDDY_SETUP_TEMP_FORCE_NEXT]
description: Force next Eddy thermal sample and refresh status
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set probe = svv.get("eddy_setup_probe", "") %}

    {% if probe == "" %}
        {action_raise_error(
            "No Eddy probe is stored in the active setup session."
        )}
    {% endif %}

    {% set temp_section = "temperature_probe " ~ probe %}

    {% if temp_section not in printer %}
        {action_raise_error(
            "Temperature probe '" ~ probe ~ "' is not available."
        )}
    {% endif %}

    {% if not printer[temp_section].in_calibration %}
        {action_raise_error(
            "Eddy thermal calibration is not currently running."
        )}
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_end"

    TEMPERATURE_PROBE_NEXT

    _EDDY_SETUP_TEMP_PROMPT

[gcode_macro EDDY_TEMP_CALIBRATE]
description: Calibrate Eddy thermal drift compensation
gcode:
    {% set ns = namespace(probe="", count=0) %}

    # Automatically locate configured Eddy probe
    {% for section in printer.configfile.settings %}
        {% if section.split()[0] == "probe_eddy_current" %}
            {% set ns.probe = section.split()[-1] %}
            {% set ns.count = ns.count + 1 %}
        {% endif %}
    {% endfor %}

    # Validate Eddy probe discovery
    {% if ns.probe == "" %}
        {action_raise_error(
            "No [probe_eddy_current <name>] configuration was found."
        )}
    {% elif ns.count > 1 %}
        {action_raise_error(
            "Multiple Eddy probes detected. This macro currently supports one configured Eddy probe."
        )}
    {% endif %}

    # Define matching probe and temperature-probe sections
    {% set probe_section = "probe_eddy_current " ~ ns.probe %}
    {% set temp_section = "temperature_probe " ~ ns.probe %}

    # Verify matching Eddy probe exists
    {% if probe_section not in printer.configfile.config %}
        {action_raise_error(
            "No [" ~ probe_section ~ "] configuration was found."
        )}
    {% endif %}

    # Verify matching temperature probe exists
    {% if temp_section not in printer.configfile.settings %}
        {action_raise_error(
            "No matching [" ~ temp_section ~ "] configuration was found."
        )}
    {% endif %}

    # Read saved configuration
    {% set probe_config = printer.configfile.config[probe_section] %}
    {% set temp_config = printer.configfile.config[temp_section] %}

    # ------------------------------------------------------------
    # PREREQUISITE CHECKS
    # ------------------------------------------------------------

    # Main Eddy Z calibration must already exist
    {% if "calibrate" not in probe_config %}
        {action_raise_error(
            "Main Eddy Z calibration is missing. Run EDDY_CURRENT_CALIBRATE and SAVE_CONFIG first."
        )}
    {% endif %}

    # Tap calibration must already exist because METHOD=tap is used
    {% if "tap_threshold" not in probe_config %}
        {action_raise_error(
            "Eddy Tap calibration is missing. Run EDDY_TAP_CALIBRATE and SAVE_CONFIG first."
        )}
    {% endif %}

    # Main Eddy calibration must have recorded the probe temperature
    {% if "calibration_temp" not in temp_config %}
        {action_raise_error(
            "Eddy Z calibration temperature is missing. Run EDDY_CURRENT_CALIBRATE again with the matching temperature probe configured, then SAVE_CONFIG."
        )}
    {% endif %}

    # TARGET is intentionally not given a macro default.
    # It should be the maximum attainable Eddy coil temperature.
    {% if 'TARGET' not in params %}
        {action_raise_error(
            "TARGET is required. Example: EDDY_TEMP_CALIBRATE TARGET=80"
        )}
    {% endif %}

    {% set target = params.TARGET|float %}

    # Check whether a saved thermal calibration already exists
    {% set thermal_saved = "drift_calibration" in temp_config %}

    # Conditional homing
    {% if 'x' not in printer.toolhead.homed_axes
          or 'y' not in printer.toolhead.homed_axes %}
        G28
    {% elif 'z' not in printer.toolhead.homed_axes %}
        G28 Z
    {% endif %}

    RESPOND TYPE=echo MSG="Using Eddy temperature probe: {ns.probe}"

    {% if thermal_saved %}
        RESPOND TYPE=echo MSG="Existing thermal drift calibration detected. Starting recalibration."
    {% else %}
        RESPOND TYPE=echo MSG="No saved thermal drift calibration detected. Starting initial calibration."
    {% endif %}

    RESPOND TYPE=echo MSG="Thermal calibration target: {target}C"
    RESPOND TYPE=echo MSG="Starting automatic Tap thermal calibration."

    TEMPERATURE_PROBE_CALIBRATE PROBE={ns.probe} TARGET={target} METHOD=tap

[gcode_macro EDDY_CURRENT_PREP]
description: Initial setup only. Prepare printer for first Eddy Z calibration.
variable_prepared: 0
gcode:
    {% set z_fake = (printer.toolhead.axis_minimum.z +
                     printer.toolhead.axis_maximum.z) / 2 %}

    # Home X/Y only if necessary
    {% if 'x' not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}

    {% if 'y' not in printer.toolhead.homed_axes %}
        G28 Y
    {% endif %}

    # zero_reference_position is explicitly a NOZZLE position.
    _EDDY_MOVE_TO_REFERENCE MODE=NOZZLE

    # Establish temporary Z position if Z is not homed
    {% if 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z={z_fake} SET_HOMED=Z
    {% endif %}

    SET_GCODE_VARIABLE MACRO=EDDY_CURRENT_PREP VARIABLE=prepared VALUE=1

    RESPOND TYPE=echo MSG="Eddy Z calibration preparation complete."
    RESPOND TYPE=echo MSG="Nozzle positioned at the configured bed_mesh zero_reference_position."
    RESPOND TYPE=echo MSG="Jog Z until the nozzle is approximately 20mm above the bed."
    RESPOND TYPE=echo MSG="Then run EDDY_CURRENT_CALIBRATE."

[gcode_macro EDDY_TAP_CALIBRATE]
description: Automatically calibrate Eddy Tap threshold
gcode:
    # Conditional homing
    {% if 'x' not in printer.toolhead.homed_axes
          or 'y' not in printer.toolhead.homed_axes %}
        G28
    {% elif 'z' not in printer.toolhead.homed_axes %}
        G28 Z
    {% endif %}

    G90
    G0 Z5

    PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=guess
    M400

    G28 Z
    G90
    G0 Z5

    PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=refine
    M400

    G28 Z
    G90
    G0 Z5

    PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=verify
