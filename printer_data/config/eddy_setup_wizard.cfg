# ============================================================
# Eddy Guided Setup Wizard
#
# Requirements:
#   - [respond]
#   - [force_move] with enable_force_move: True for initial setup
#   - eddy_macros.cfg containing:
#       EDDY_LDC_PREP
#       EDDY_LDC_CALIBRATE
#       EDDY_CURRENT_PREP
#       EDDY_CURRENT_CALIBRATE
#       EDDY_TAP_CALIBRATE
#       EDDY_TEMP_CALIBRATE
#
# If [save_variables] is already defined elsewhere in your
# configuration, do not define it a second time.
# ============================================================

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

[gcode_macro EDDY_SETUP]
description: Guided automatic Eddy setup and calibration assistant
gcode:
    {% set ns = namespace(probe="", count=0) %}

    # Automatically locate configured Eddy probe
    {% for section in printer.configfile.settings %}
        {% if section.split()[0] == "probe_eddy_current" %}
            {% set ns.probe = section.split()[-1] %}
            {% set ns.count = ns.count + 1 %}
        {% endif %}
    {% endfor %}

    # Validate discovery
    {% if ns.probe == "" %}
        {action_raise_error(
            "No [probe_eddy_current <name>] configuration was found."
        )}
    {% elif ns.count > 1 %}
        {action_raise_error(
            "EDDY_SETUP currently supports one configured Eddy probe."
        )}
    {% endif %}

    {% set probe_section = "probe_eddy_current " ~ ns.probe %}
    {% set temp_section = "temperature_probe " ~ ns.probe %}

    {% if probe_section not in printer.configfile.config %}
        {action_raise_error(
            "No [" ~ probe_section ~ "] configuration was found."
        )}
    {% endif %}

    {% set probe_config = printer.configfile.config[probe_section] %}
    {% set temp_exists = temp_section in printer.configfile.settings %}

    # TARGET handling
    {% set svv = printer.save_variables.variables %}
    {% set active = svv.get("eddy_setup_active", 0)|int %}
    {% set saved_target = svv.get("eddy_setup_target", 0)|float %}

    {% if 'TARGET' in params %}
        {% set target = params.TARGET|float %}
    {% elif active == 1 and saved_target > 0 %}
        {% set target = saved_target %}
    {% else %}
        {% set target = 80 %}
    {% endif %}

    # Keep wizard alive across SAVE_CONFIG restarts
    SAVE_VARIABLE VARIABLE=eddy_setup_active VALUE=1
    SAVE_VARIABLE VARIABLE=eddy_setup_probe VALUE='"{ns.probe}"'
    SAVE_VARIABLE VARIABLE=eddy_setup_target VALUE={target}

    # Detect calibration results already pending SAVE_CONFIG
    {% set pending = printer.configfile.save_config_pending_items %}
    {% set probe_pending = pending.get(probe_section, {}) or {} %}

    {% if temp_exists %}
        {% set temp_pending = pending.get(temp_section, {}) or {} %}
    {% else %}
        {% set temp_pending = {} %}
    {% endif %}

    {% set pending_eddy =
        "reg_drive_current" in probe_pending
        or "calibrate" in probe_pending
        or "tap_threshold" in probe_pending
        or "drift_calibration" in temp_pending %}

    # Result already waiting for SAVE_CONFIG
    {% if pending_eddy %}

        RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup"
        RESPOND TYPE=command MSG="action:prompt_text A completed Eddy calibration is waiting to be saved."
        RESPOND TYPE=command MSG="action:prompt_button Save & Continue|_EDDY_SETUP_SAVE_CONTINUE|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Setup|EDDY_SETUP_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_show"

    # LDC drive current
    {% elif "reg_drive_current" not in probe_config %}

        RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup - LDC Calibration"
        RESPOND TYPE=command MSG="action:prompt_text LDC drive-current calibration is required."
        RESPOND TYPE=command MSG="action:prompt_text The Eddy sensor will be prepared for initial LDC setup."
        RESPOND TYPE=command MSG="action:prompt_button Begin LDC Setup|_EDDY_SETUP_LDC_PREP|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Setup|EDDY_SETUP_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_show"

    # Main Eddy Z / frequency calibration
    {% elif "calibrate" not in probe_config %}

        RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup - Eddy Z Calibration"
        RESPOND TYPE=command MSG="action:prompt_text LDC calibration is saved."
        RESPOND TYPE=command MSG="action:prompt_text Main Eddy Z calibration is required next."
        RESPOND TYPE=command MSG="action:prompt_text Klipper's normal paper-test adjustment screen will be used."
        RESPOND TYPE=command MSG="action:prompt_button Begin Eddy Z Calibration|_EDDY_SETUP_CURRENT_PREP|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Setup|EDDY_SETUP_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_show"

    # Tap calibration
    {% elif "tap_threshold" not in probe_config %}

        RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup - Tap Calibration"
        RESPOND TYPE=command MSG="action:prompt_text Main Eddy Z calibration is saved."
        RESPOND TYPE=command MSG="action:prompt_text Eddy Tap calibration is required next."
        RESPOND TYPE=command MSG="action:prompt_button Begin Tap Calibration|_EDDY_SETUP_TAP_RUN|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Setup|EDDY_SETUP_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_show"

    # Thermal calibration
    {% elif temp_exists %}

        {% set temp_config = printer.configfile.config[temp_section] %}

        {% if "drift_calibration" not in temp_config %}

            {% set current_temp = printer[temp_section].temperature|float %}
            {% set thermal_active = printer[temp_section].in_calibration %}

            {% if thermal_active %}

                RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup - Thermal Calibration Active"
                RESPOND TYPE=command MSG="action:prompt_text An Eddy thermal calibration session is already active."
                RESPOND TYPE=command MSG="action:prompt_text Current Eddy coil temperature: {current_temp|round(1)}C"
                RESPOND TYPE=command MSG="action:prompt_text A new thermal calibration cannot be started until the current session is ended."

                RESPOND TYPE=command MSG="action:prompt_button End Thermal Session|_EDDY_SETUP_TEMP_RECOVER|warning"
                RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Setup|EDDY_SETUP_CANCEL|error"

                RESPOND TYPE=command MSG="action:prompt_show"

            {% else %}

                RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup - Thermal Calibration"
                RESPOND TYPE=command MSG="action:prompt_text Thermal drift calibration is the final step."
                RESPOND TYPE=command MSG="action:prompt_text Current Eddy coil temperature: {current_temp|round(1)}C"
                RESPOND TYPE=command MSG="action:prompt_text Eddy coil target: {target}C"
                RESPOND TYPE=command MSG="action:prompt_text Adjust the target if desired, then begin calibration."

                RESPOND TYPE=command MSG="action:prompt_button_group_start"
                RESPOND TYPE=command MSG="action:prompt_button -5C|_EDDY_SETUP_TEMP_ADJUST DELTA=-5|secondary"
                RESPOND TYPE=command MSG="action:prompt_button -1C|_EDDY_SETUP_TEMP_ADJUST DELTA=-1|secondary"
                RESPOND TYPE=command MSG="action:prompt_button +1C|_EDDY_SETUP_TEMP_ADJUST DELTA=1|secondary"
                RESPOND TYPE=command MSG="action:prompt_button +5C|_EDDY_SETUP_TEMP_ADJUST DELTA=5|secondary"
                RESPOND TYPE=command MSG="action:prompt_button_group_end"

                RESPOND TYPE=command MSG="action:prompt_button Begin Thermal Calibration|_EDDY_SETUP_TEMP_RUN TARGET={target}|primary"
                RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Setup|EDDY_SETUP_CANCEL|error"

                RESPOND TYPE=command MSG="action:prompt_show"

            {% endif %}

        {% else %}

            _EDDY_SETUP_COMPLETE

        {% endif %}

    # No matching temperature probe means thermal setup is not applicable
    {% else %}

        _EDDY_SETUP_COMPLETE

    {% endif %}

[delayed_gcode _EDDY_SETUP_LDC_POSITION_WATCH]
gcode:
    {% if printer.manual_probe.is_active %}

        # Native MANUAL_PROBE is still running
        UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_LDC_POSITION_WATCH DURATION=1

    {% elif printer["gcode_macro EDDY_LDC_PREP"].prepared|int == 1 %}

        # Manual positioning session has ended
        RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup - LDC Positioning Complete"
        RESPOND TYPE=command MSG="action:prompt_text Manual Z positioning has ended."
        RESPOND TYPE=command MSG="action:prompt_text If you selected ACCEPT after positioning the Eddy sensor approximately 20mm above the bed, continue with LDC calibration."
        RESPOND TYPE=command MSG="action:prompt_button Continue LDC Calibration|EDDY_SETUP_LDC_CONTINUE|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Setup|EDDY_SETUP_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_show"

    {% endif %}


[gcode_macro _EDDY_SETUP_LDC_PREP]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

    EDDY_LDC_PREP

    RESPOND TYPE=echo MSG="Use Klipper's Z adjustment controls to position the Eddy sensor approximately 20mm above the bed."
    RESPOND TYPE=echo MSG="When positioned, select ACCEPT."

    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_LDC_POSITION_WATCH DURATION=1

    MANUAL_PROBE


[gcode_macro EDDY_SETUP_LDC_CONTINUE]
description: Continue Eddy setup after LDC Z positioning
gcode:
    {% if printer.manual_probe.is_active %}
        {action_raise_error(
            "Manual Z positioning is still active. Select ACCEPT before continuing."
        )}
    {% endif %}

    {% if printer["gcode_macro EDDY_LDC_PREP"].prepared|int != 1 %}
        {action_raise_error(
            "EDDY_LDC_PREP has not been completed. Run EDDY_SETUP first."
        )}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=1
    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=2

    EDDY_LDC_CALIBRATE


[gcode_macro _EDDY_SETUP_CURRENT_PREP]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

    EDDY_CURRENT_PREP

    SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=2
    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=2

    EDDY_CURRENT_CALIBRATE


[gcode_macro _EDDY_SETUP_TAP_RUN]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

    SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=3
    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=2

    EDDY_TAP_CALIBRATE


[gcode_macro _EDDY_SETUP_TEMP_RUN]
gcode:
    {% set target = params.TARGET|default(80)|float %}

    RESPOND TYPE=command MSG="action:prompt_end"

    SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=4
    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=2

    EDDY_TEMP_CALIBRATE TARGET={target}

    RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup - Thermal Calibration Running"
    RESPOND TYPE=command MSG="action:prompt_text Thermal calibration is currently running."
    RESPOND TYPE=command MSG="action:prompt_text Target coil temperature: {target}C"
    RESPOND TYPE=command MSG="action:prompt_text Klipper will automatically take samples as the Eddy temperature increases."
    RESPOND TYPE=command MSG="action:prompt_text If the probe stops heating before reaching the target, you may force another sample or finish using the samples collected so far."

    RESPOND TYPE=command MSG="action:prompt_button Force Next Sample|TEMPERATURE_PROBE_NEXT|warning"
    RESPOND TYPE=command MSG="action:prompt_button Finish at Current Temperature|TEMPERATURE_PROBE_COMPLETE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Abort Thermal Calibration|_EDDY_SETUP_TEMP_ABORT|error"

    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _EDDY_SETUP_STATE]
variable_step: 0
gcode:


[delayed_gcode _EDDY_SETUP_WATCH]
gcode:
    {% set step = printer["gcode_macro _EDDY_SETUP_STATE"].step|int %}
    {% set svv = printer.save_variables.variables %}
    {% set probe = svv.get("eddy_setup_probe", "") %}

    {% if step > 0 and probe != "" %}

        {% set probe_section = "probe_eddy_current " ~ probe %}
        {% set temp_section = "temperature_probe " ~ probe %}

        {% set pending = printer.configfile.save_config_pending_items %}
        {% set probe_pending = pending.get(probe_section, {}) or {} %}
        {% set temp_pending = pending.get(temp_section, {}) or {} %}

        {% set ns = namespace(done=false, result="") %}

        {% if step == 1 and "reg_drive_current" in probe_pending %}
            {% set ns.done = true %}
            {% set ns.result = "LDC drive-current calibration" %}

        {% elif step == 2 and "calibrate" in probe_pending %}
            {% set ns.done = true %}
            {% set ns.result = "Main Eddy Z calibration" %}

        {% elif step == 3 and "tap_threshold" in probe_pending %}
            {% set ns.done = true %}
            {% set ns.result = "Eddy Tap calibration" %}

        {% elif step == 4 and "drift_calibration" in temp_pending %}
            {% set ns.done = true %}
            {% set ns.result = "Thermal drift calibration" %}
        {% endif %}

        {% if ns.done %}

            SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=0

            RESPOND TYPE=command MSG="action:prompt_end"

            RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup - Step Complete"
            RESPOND TYPE=command MSG="action:prompt_text {ns.result} completed successfully."
            RESPOND TYPE=command MSG="action:prompt_text The result is ready to be written to the printer configuration."
            RESPOND TYPE=command MSG="action:prompt_button Save & Continue|_EDDY_SETUP_SAVE_CONTINUE|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Stop Setup|EDDY_SETUP_CANCEL|error"
            RESPOND TYPE=command MSG="action:prompt_show"

        {% else %}

            UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=2

        {% endif %}

    {% endif %}


[gcode_macro _EDDY_SETUP_SAVE_CONTINUE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

    SAVE_VARIABLE VARIABLE=eddy_setup_active VALUE=1

    SAVE_CONFIG


[delayed_gcode _EDDY_SETUP_AUTO_RESUME]
initial_duration: 3
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set active = svv.get("eddy_setup_active", 0)|int %}
    {% set target = svv.get("eddy_setup_target", 0)|float %}

    {% if active == 1 %}

        {% if target > 0 %}
            EDDY_SETUP TARGET={target}
        {% else %}
            EDDY_SETUP
        {% endif %}

    {% endif %}


[gcode_macro _EDDY_SETUP_COMPLETE]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set probe = svv.get("eddy_setup_probe", "") %}
    {% set target = svv.get("eddy_setup_target", 80)|float %}

    {% set probe_section = "probe_eddy_current " ~ probe %}
    {% set temp_section = "temperature_probe " ~ probe %}

    {% set probe_config = printer.configfile.config[probe_section] %}
    {% set temp_exists = temp_section in printer.configfile.settings %}

    {% set ldc_current = probe_config.get("reg_drive_current", "N/A") %}
    {% set tap_threshold = probe_config.get("tap_threshold", "N/A") %}

    {% if temp_exists %}
        {% set temp_config = printer.configfile.config[temp_section] %}
        {% set calibration_temp = temp_config.get("calibration_temp", "N/A") %}
        {% set thermal_min_temp = temp_config.get("drift_calibration_min_temp", "N/A") %}
    {% else %}
        {% set calibration_temp = "N/A" %}
        {% set thermal_min_temp = "N/A" %}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=0
    SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=0

    RESPOND TYPE=command MSG="action:prompt_begin Eddy Setup Complete"

    RESPOND TYPE=command MSG="action:prompt_text LDC drive current: {ldc_current}"
    RESPOND TYPE=command MSG="action:prompt_text Tap threshold: {tap_threshold}"

    {% if temp_exists %}
        RESPOND TYPE=command MSG="action:prompt_text Eddy Z calibration temp: {calibration_temp}C"
        RESPOND TYPE=command MSG="action:prompt_text Thermal target: {target}C"
        RESPOND TYPE=command MSG="action:prompt_text Thermal calibration minimum temp: {thermal_min_temp}C"
        RESPOND TYPE=command MSG="action:prompt_text Thermal compensation: OK"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Thermal compensation: Not applicable - no Eddy temperature sensor detected."
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_text Eddy setup is complete."
    RESPOND TYPE=command MSG="action:prompt_footer_button Finish|_EDDY_SETUP_CLOSE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

    SAVE_VARIABLE VARIABLE=eddy_setup_active VALUE=0
    SAVE_VARIABLE VARIABLE=eddy_setup_target VALUE=0
    SAVE_VARIABLE VARIABLE=eddy_setup_probe VALUE='""'

[gcode_macro EDDY_SETUP_CANCEL]
description: Cancel guided Eddy setup
gcode:
    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=0
    SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=0

    SAVE_VARIABLE VARIABLE=eddy_setup_active VALUE=0
    SAVE_VARIABLE VARIABLE=eddy_setup_target VALUE=0
    SAVE_VARIABLE VARIABLE=eddy_setup_probe VALUE='""'

    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=echo MSG="Guided Eddy setup cancelled."

[gcode_macro _EDDY_SETUP_TEMP_ADJUST]
description: Adjust Eddy thermal calibration target
gcode:
    {% set delta = params.DELTA|default(0)|float %}
    {% set svv = printer.save_variables.variables %}
    {% set target = svv.get("eddy_setup_target", 80)|float %}

    {% if target <= 0 %}
        {% set target = 80 %}
    {% endif %}

    {% set new_target = target + delta %}

    {% if new_target <= 0 %}
        {action_raise_error(
            "Eddy thermal calibration target must be greater than 0C."
        )}
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_end"

    SAVE_VARIABLE VARIABLE=eddy_setup_target VALUE={new_target}

    EDDY_SETUP TARGET={new_target}

[gcode_macro _EDDY_SETUP_TEMP_RUN]
gcode:
    {% set target = params.TARGET|default(80)|float %}

    RESPOND TYPE=command MSG="action:prompt_end"

    SAVE_VARIABLE VARIABLE=eddy_setup_target VALUE={target}

    SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=4
    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=2

    EDDY_TEMP_CALIBRATE TARGET={target}

    _EDDY_SETUP_TEMP_PROMPT

[gcode_macro _EDDY_SETUP_TEMP_ABORT]
gcode:
    ABORT

    UPDATE_DELAYED_GCODE ID=_EDDY_SETUP_WATCH DURATION=0
    SET_GCODE_VARIABLE MACRO=_EDDY_SETUP_STATE VARIABLE=step VALUE=0

    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=echo MSG="Thermal calibration aborted. Calibration results were discarded."

    EDDY_SETUP

[gcode_macro _EDDY_SETUP_CLOSE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
